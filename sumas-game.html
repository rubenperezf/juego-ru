<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sumas de 1 Dígito</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="game-container">
      <!-- Pantalla de Inicio -->
      <div id="start-screen" class="screen active">
        <h1>Sumas</h1>
        <p>Suma números del 1 al 9</p>
        <button id="play-btn" class="btn-large">PLAY</button>
        <a href="index.html" class="back-link">← Volver</a>
      </div>

      <!-- Pantalla del Juego -->
      <div id="game-screen" class="screen">
        <div id="suma-display">
          <span id="suma-text"></span>
          <input type="number" id="suma-input" class="suma-input" placeholder="?" min="0" max="18" />
        </div>
        <div id="game-controls">
          <button id="check-btn" class="control-btn green-btn">✓</button>
          <button id="wrong-btn" class="control-btn red-btn">✗</button>
        </div>
      </div>

      <!-- Pantalla de Finalización -->
      <div id="finish-screen" class="screen">
        <h1>¡FINISH!</h1>
        <p id="finish-score"></p>
        <button id="play-again-btn" class="btn-large">PLAY AGAIN</button>
        <a href="index.html" class="back-link">← Volver</a>
      </div>
    </div>

    <script src="sumas-game.js"></script>
  </body>
</html>
